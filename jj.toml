[user]
name = "Thom Maycroft"
email = "thommay@apple.com"

[ui]
editor = "hx"

[revset-aliases]
ghp = 'ancestors(bookmarks(exact:"gh-pages") | remote_bookmarks(exact:"gh-pages"))'
"immutable_heads()" = "builtin_immutable_heads() | ghp"

[aliases]
l = ["log","-r", "@ | ancestors(immutable_heads().., 2) ~ ghp | trunk()"]
lall = ["log","-r", "..all ~ ghp"]
